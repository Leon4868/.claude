tapd:
  base_url: "https://api.tapd.cn"
  workspace_id: "35238004"
  token_env: "TAPD_TOKEN"

  status_map:
    status_1: "需求中"
    planning: "需求完成"
    audited: "已评审"
    developing: "开发中"
    resolved: "完成开发"
    status_2: "已测试"
    status_3: "已上线"
    rejected: "已挂起"
    status_4: "测试通过"
    status_5: "可上线"
    status_6: "测试中"
    workflow_suspended: "流程挂起"
    workflow_end: "流程终止"

  workflow:
    start_dev: "developing"
    commit_code: "developing"
    create_mr: "resolved"
    deploy_test: "status_4"
    deploy_prod: "status_4"
    acceptance: "status_6"

project:
  # 项目代码根目录（可通过环境变量 PROJECT_ROOT_DIR 覆盖）
  root_dir: "${PROJECT_ROOT_DIR}"

  # 项目类型：frontend / backend / fullstack
  type: "${PROJECT_TYPE:backend}"
